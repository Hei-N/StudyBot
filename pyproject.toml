[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studybot"
version = "0.1.0"
description = "Local-first personal study assistant with a local API and a Flutter desktop client"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "ollama>=0.6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    # Pinned: starlette uses an anyio alias that newer anyio releases deprecate
    # at import time, which fails under `pytest -W error`. Revisit once starlette
    # catches up.
    "anyio==4.5.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Needed only for Starlette's `TestClient` in tests.
    "httpx2",
]
# Needed only to build the standalone macOS app (scripts/build_macos_app.sh).
build = ["pyinstaller>=6.17"]

[project.scripts]
studybot = "studybot.__main__:main"
studybot-server = "studybot.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
